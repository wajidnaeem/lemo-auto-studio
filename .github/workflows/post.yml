# Posts one approved film to YouTube, Facebook and Instagram.
# Started by the Uploader (workflow_dispatch) after you press Approve on the board.
# Keys live in this repo's encrypted secrets: Settings → Secrets and variables → Actions.
name: post-film
on:
  workflow_dispatch:
    inputs:
      film_id: { description: "films/<film_id>", required: true }
      platforms: { description: "comma list: youtube,facebook,instagram", required: false, default: "youtube,facebook,instagram" }
permissions:
  contents: write
concurrency: { group: post-film, cancel-in-progress: false }
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get the video from the film's release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p media
          gh release download "film-${{ inputs.film_id }}" --dir media --repo "${{ github.repository }}"
          ls -la media
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests google-auth google-api-python-client
      - name: Post
        env:
          FILM_ID: ${{ inputs.film_id }}
          PLATFORMS: ${{ inputs.platforms }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python poster/post_film.py
      - name: Save the post links
        if: always()
        run: |
          git config user.name "lemo-auto-studio bot"
          git config user.email "actions@users.noreply.github.com"
          git add films/${{ inputs.film_id }}/posted.json || true
          git commit -m "posted: ${{ inputs.film_id }}" || echo "nothing to commit"
          git pull --rebase -q && git push
